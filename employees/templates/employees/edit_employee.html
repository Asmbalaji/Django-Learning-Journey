
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #253247;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            color: #cbd5e1;
            margin-bottom: 0;
        }

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: inline-block;
            margin-left: 15px;
            color: #2563eb;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: #dc2626;
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Management System</h1>
    <p>Update employee information</p>
</header>

<div class="container">

    <h2>Edit Employee Details</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>

        <a href="{% url 'employee_list' %}" class="back-link">
            Back to Employee List
        </a>
    </form>

</div>

</body>
</html>
